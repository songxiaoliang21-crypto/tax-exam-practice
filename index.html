<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>税务师刷题系统 MVP</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --panel-2: #eef3f8;
      --text: #152033;
      --muted: #697386;
      --line: #dbe2ea;
      --brand: #0f7f6b;
      --brand-2: #f4a12c;
      --bad: #d94b4b;
      --good: #16865d;
      --warn: #b7791f;
      --shadow: 0 12px 28px rgba(24, 39, 75, .08);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #111827;
      --panel: #182231;
      --panel-2: #243244;
      --text: #edf2f7;
      --muted: #a9b4c2;
      --line: #334155;
      --brand: #43b69f;
      --brand-2: #f3b45b;
      --bad: #ff7a7a;
      --good: #62d49f;
      --warn: #f5c16c;
      --shadow: 0 12px 28px rgba(0, 0, 0, .26);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }
    button, input, textarea, select { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      min-height: 40px;
      padding: 0 12px;
      cursor: pointer;
    }
    button.primary { background: var(--brand); border-color: var(--brand); color: white; }
    button.warn { border-color: rgba(217, 75, 75, .35); color: var(--bad); }
    button.ghost { background: transparent; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
      flex: 0 0 auto;
    }
    h1 { font-size: 17px; margin: 0; line-height: 1.2; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px;
    }
    .grid { display: grid; gap: 12px; }
    .stats {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .card, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .card { padding: 14px; }
    .metric b { display: block; font-size: 24px; margin-bottom: 4px; }
    .metric span { color: var(--muted); font-size: 13px; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      padding: 8px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    .tabs button {
      display: grid;
      place-items: center;
      gap: 2px;
      min-height: 48px;
      padding: 4px;
      font-size: 12px;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
    }
    .tabs button.active {
      background: var(--panel-2);
      color: var(--brand);
      border-color: var(--line);
    }
    .tabs svg, .icon { width: 19px; height: 19px; stroke-width: 2; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 18px 0 10px;
    }
    h2 { margin: 0; font-size: 18px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 40px;
    }
    textarea { min-height: 180px; resize: vertical; line-height: 1.6; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .import-grid {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      gap: 12px;
    }
    label span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }
    .list {
      display: grid;
      gap: 10px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .row-title { font-weight: 700; }
    .row-meta, .tiny { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 26px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .question-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 12px;
      align-items: start;
    }
    .question-title { font-size: 17px; line-height: 1.7; white-space: pre-wrap; }
    .options {
      display: grid;
      gap: 9px;
      margin: 14px 0;
    }
    .option {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      background: var(--panel);
      line-height: 1.55;
    }
    .option.selected { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 9%, var(--panel)); }
    .option.correct { border-color: var(--good); }
    .option.wrong { border-color: var(--bad); }
    .badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--panel-2);
      font-weight: 800;
    }
    .answer-box {
      display: none;
      border-top: 1px solid var(--line);
      margin-top: 12px;
      padding-top: 12px;
      line-height: 1.65;
    }
    .answer-box.show { display: block; }
    .answer-ok { color: var(--good); font-weight: 800; }
    .answer-bad { color: var(--bad); font-weight: 800; }
    .side {
      display: grid;
      gap: 10px;
      position: sticky;
      top: 78px;
    }
    .progress {
      height: 8px;
      background: var(--panel-2);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar { height: 100%; background: var(--brand); width: 0%; }
    .hide { display: none !important; }
    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 30;
      max-width: min(92vw, 560px);
      display: none;
    }
    .toast.show { display: block; }
    .subject-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .subject-chips button.active {
      border-color: var(--brand);
      color: var(--brand);
      background: color-mix(in srgb, var(--brand) 10%, var(--panel));
    }
    @media (max-width: 860px) {
      main { padding: 12px 12px 86px; }
      .stats, .form-grid, .import-grid, .question-shell { grid-template-columns: 1fr; }
      .metric b { font-size: 21px; }
      .side { position: static; }
      .tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
      }
      .topbar { padding: 10px 12px; }
      .topbar .toolbar button:not(#themeBtn) { display: none; }
    }
  </style>
</head>
<body>
<div class="app" data-theme="light">
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo">税</div>
        <div>
          <h1>税务师刷题系统</h1>
          <div class="sub">本地题库 · 离线练习 · 第 <span id="roundNo">1</span> 轮</div>
        </div>
      </div>
      <div class="toolbar">
        <button id="themeBtn" title="切换明暗模式" aria-label="切换明暗模式"></button>
        <button id="newRoundBtn">开始新一轮</button>
      </div>
    </div>
  </header>

  <main>
    <section id="view-home">
      <div class="grid stats" id="homeStats"></div>
      <div class="section-head">
        <h2>章节练习</h2>
        <div class="subject-chips" id="subjectChips"></div>
      </div>
      <div id="chapterList" class="list"></div>
    </section>

    <section id="view-import" class="hide">
      <div class="section-head">
        <h2>PDF / 文本导入</h2>
        <button class="ghost" id="sampleBtn">填入示例</button>
      </div>
      <div class="import-grid">
        <div class="panel card">
          <div class="form-grid">
            <label><span>科目</span><select id="importSubject"></select></label>
            <label><span>重复题处理</span><select id="duplicateMode"><option value="skip">自动跳过</option><option value="overwrite">覆盖更新</option></select></label>
            <label><span>章节识别</span><select id="chapterMode"><option value="auto">保留 PDF 章节</option><option value="fallback">缺失时归入未分章</option></select></label>
            <label><span>文件</span><input id="pdfFile" class="input" type="file" accept=".pdf,.txt"></label>
          </div>
          <div style="height:10px"></div>
          <textarea id="importText" placeholder="可粘贴 PDF 提取后的全文。结构建议：前半部分为题目，后半部分为答案和解析。"></textarea>
          <div class="toolbar" style="margin-top:10px">
            <button class="primary" id="parseBtn">解析预览</button>
            <button id="importBtn" disabled>导入题库</button>
            <button id="clearTextBtn">清空</button>
          </div>
          <p class="tiny">PDF 自动抽取依赖浏览器端 PDF.js。当前文件不联网也能刷题；若 PDF.js 未加载，可先把 PDF 文本复制到输入框。</p>
        </div>
        <div class="panel card">
          <h3>解析结果</h3>
          <div id="parseSummary" class="tiny">尚未解析</div>
          <div id="previewList" class="list" style="margin-top:10px"></div>
        </div>
      </div>
    </section>

    <section id="view-practice" class="hide">
      <div class="question-shell">
        <div class="panel card">
          <div class="toolbar" style="justify-content:space-between">
            <button id="backHomeBtn">返回章节</button>
            <span class="pill" id="questionMeta"></span>
          </div>
          <div class="progress" style="margin:12px 0"><div class="bar" id="practiceBar"></div></div>
          <div class="question-title" id="questionStem"></div>
          <div class="options" id="optionList"></div>
          <div class="toolbar">
            <button class="primary" id="submitAnswerBtn">提交答案</button>
            <button id="favBtn">收藏</button>
            <button id="prevBtn">上一题</button>
            <button id="nextBtn">下一题</button>
          </div>
          <div id="answerBox" class="answer-box"></div>
        </div>
        <aside class="side">
          <div class="card">
            <h3>本组进度</h3>
            <div id="practiceStats" class="tiny"></div>
          </div>
          <div class="card">
            <h3>快速跳题</h3>
            <div class="toolbar" id="quickJump"></div>
          </div>
        </aside>
      </div>
    </section>

    <section id="view-wrong" class="hide">
      <div class="section-head"><h2>错题本</h2><div class="toolbar"><button id="clearWrongBtn" class="warn">清空错题</button></div></div>
      <div class="toolbar"><select id="wrongSubject"></select><select id="wrongChapter"></select></div>
      <div id="wrongList" class="list" style="margin-top:12px"></div>
    </section>

    <section id="view-fav" class="hide">
      <div class="section-head"><h2>收藏夹</h2></div>
      <div class="toolbar"><select id="favSubject"></select><select id="favChapter"></select></div>
      <div id="favList" class="list" style="margin-top:12px"></div>
    </section>

    <section id="view-heavy" class="hide">
      <div class="section-head"><h2>重点错题库</h2></div>
      <div id="heavyList" class="list"></div>
    </section>

    <section id="view-search" class="hide">
      <div class="section-head"><h2>搜索</h2></div>
      <input id="searchInput" class="input" placeholder="题干、知识点、章节、题号">
      <div id="searchList" class="list" style="margin-top:12px"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="主导航">
    <button data-tab="home" class="active" title="首页"></button>
    <button data-tab="import" title="导入"></button>
    <button data-tab="wrong" title="错题"></button>
    <button data-tab="fav" title="收藏"></button>
    <button data-tab="heavy" title="重点错题"></button>
    <button data-tab="search" title="搜索"></button>
  </nav>
  <div id="toast" class="toast"></div>
</div>

支出金额 单位：万元 日期 每期资产支出金额 累计资产支出金额 闲置借款资金 用于短期投资金额 2024 年 1 月 1 日 1 500 1 500 1 500 2024 年 7 月 1 日 3 500 5 000 4 000 2025 年 1 月 1 日 3 500 8 500 500 总计 8 500 - - 2024 年专门借款在资本化期间发生的利息金额 =3 000×5%＋6 000×6%×6÷12=330（万元） 2024 年专门借款在资本化期间闲置资金收益 =1 500×0.5%×6＋4 000×0.5%×6=165（万元） 2024 年的利息资本化金额=330－165=165（万元） 2025 年 1 月 1 日至 6 月 30 日专门借款在资本化期间发生的利息金额 =3 000×5%×6÷12＋6 000×6%×6÷12=255（万元） 2025 年 1 月 1 日至 6 月 30 日专门借款在资本化期间闲置资金收益 =500×0.5%×6=15（万元） 2025 年 1 月 1 日至 6 月 30 日利息资本化金额=255－15=240（万元）"}, "answer": "ABD", "analysis": "筹建期间不应资本化的借款费用应计入管理费用，选项 A 当选；购建固定资产过\n程中发生非正常中断，且中断时间连续超过 3 个月，应当暂停借款费用资本化，选项 B 当选，\n选项 C 不当选；资本化期间，每一个会计期间的利息资本化金额，不应当超过当期相关借款实\n际发生的利息金额，选项 D 当选；所购建或生产的符合资本化条件的资产达到预定可使用或可\n销售状态时，借款费用应当停止资本化，选项 E 不当选。\n12.【解析】由于尚公司使用了专门借款建造办公楼，而且办公楼建造支出没有超过专门借\n款金额，因此，尚公司 2024 年、2025 年建造办公楼应予资本化的利息金额计算如下：\n（1）确定借款费用资本化期间为 2024 年 1 月 1 日至 2025 年 6 月 30 日。\n（2）计算在资本化期间内专门借款实际发生的利息金额。\n2024 年专门借款发生的利息金额\n=3 000×5%＋6 000×6%×6÷12=330（万元）\n2025 年 1 月 1 日至 6 月 30 日专门借款发生的利息金额\n=3 000×5%×6÷12＋6 000×6%×6÷12=255（万元）\n（3）计算在资本化期间内利用闲置的专门借款资金进行短期投资的收益。\n2024 年短期投资收益\n=1 500×0.5%×6＋4 000×0.5%×6\n=165（万元）\n2025 年 1 月 1 日至 6 月 30 日短期投资收益\n=500×0.5%×6=15（万元）\n（4）由于在资本化期间内，专门借款利息费用的资本化金额应当以其实际发生的利息费用\n减去将闲置的借款资金进行短期投资取得的投资收益后的金额确定，因此：\n尚公司 2024 年的利息资本化金额=330－165=165（万元）\n尚公司 2025 年的利息资本化金额=255－15=240（万元）\n（5）有关账务处理如下（单位：万元）：\n① 2024 年 12 月 31 日：\n借：在建工程——办公楼 165\n银行存款 165\n贷：长期借款——应计利息 330\n② 2025 年 6 月 30 日：\n借：在建工程——办公楼 240\n第 十 三 章 非 流 动 负 债 习 题 纯 享 | 精 讲 班 -尚 志 中\n34 学 会 计 就 到 之 了 课 堂\n银行存款 15\n贷：长期借款——应计利息 255", "favorite": false, "wrongCount": 0, "createdAt": 0, "id": "财务与会计|第十三章 非流动负债|11|多选|下列关于借款费用的表述中，正确的有（）。"}, {"subject": "财务与会计", "chapter": "第十三章 非流动负债", "number": "13", "type": "单选", "stem": "某公司于 2020 年 7 月 1 日从银行取得专门借款 5 000 万元用于新建 一座厂房，年利率为 5%，利息分季支付，借款期限 2 年。2020 年 10 月 1 日正式开始建设厂房， 预计工期 15 个月，采用出包方式建设。该公司于开始建设日、2020 年 12 月 31 日和 2021 年 5 月 1 日分别向承包方付款 1 200 万元、1 000 万元和 1 500 万元。由于可预见的冰冻气候，工程 在 2021 年 1 月 12 日到 3 月 12 日期间暂停。2021 年 12 月 31 日工程达到预定可使用状态，并向 承包方支付了剩余工程款 8 。因为尚公司是一家知名酸酒销售商，根据租赁合同，尚公司应在正常工作时间内经 营该商店，所以尚公司开设的这家商店不可能不发生销售。 83.【例题】承租人尚公司签订了一份为期 3 年的“大灰机”租赁合同。合同中关于租赁付 款额的条款为：如果该飞机在某月份的飞行里程不超过 10 万里程，则该月应付的租金为 10 万 元；如果该飞机在某月份的飞行里程超过 10 万公里但不超过 20 万公里，则该月应付的租金为 16 万元；该飞机 1 个月内的飞行里程最高不能超过 20 万公里，否则承租人需支付巨额罚款。 本例中，租赁付款额中包含基于使用情况的可变性，且在某些月份里确实可避免支付较高 租金，然而，月付款额 10 万元是不可避免的。因此，月付款额 10 万元属于实质固定付款额， 应被纳入租赁负债的初始计量中。如果飞行里程超过 10 万公里但不超过 20 万公里，需要额外 支付的 6 万元不应计入租赁负债，而应当在发生时计入当期损益或其他资产成本当中。 84.【例题】尚公司租入某办公楼的一层楼，为期 10 年。尚公司有权选择在第 5 年后提前 终止租赁，并以相当于 6 个月的租金作为罚金。每年的租赁付款额为固定金额 12 万元。该办公 楼是全新的，并且在周边商业园区的办公楼中处于技术领先水平。上述租赁付款额与市场租金 水平相符。 在租赁期开始日，尚公司评估后认为，6 个月的租金对于尚公司而言金额重大，且同等条件 下也难以按更优惠的价格租入其他办公楼，可以合理确定不会选择提前终止租赁，因此，其租 赁负债不应包括提前终止租赁时需支付的罚金，租赁期确定为 10 年。 85.【例题】承租人尚公司与出租人帅公司签订了飞机租赁合同，租赁期为 5 年。合同中就 担保余值的规定为：如果标的飞机在租赁期结束时的公允价值低于 100 个亿，则尚公司需向帅 公司支付 100 个亿与飞机公允价值之间的差额。 在租赁期开始日，若尚公司预计标的飞机在租赁期结束时的公允价值为 98 个亿，即尚公司 预计在担保余值下将支付的金额为 2 个亿。则尚公司在计算租赁负债时，与担保余值相关的付 款额为 2 个亿。"}, "answer": "B", "analysis": "甲公司于 2021 年 1 月 1 日进驻该写字楼并开始装修，当日已拥有对商铺使用权的\n控制，因此租赁期开始日为 2021 年 1 月 1 日。再者甲公司不能合理确定将行使续租选择权，租\n赁期不应包含续租选择权的期间。甲公司确定的租赁期为 6 年。", "favorite": false, "wrongCount": 0, "createdAt": 0, "id": "财务与会计|第十三章 非流动负债|81|单选|2020年12月1日，甲公司与乙公司签订租赁协"}, {"subject": "财务与会计", "chapter": "第十三章 非流动负债", "number": "86", "type": "单选", "stem": "在租赁期开始日，下列不属于租赁付款额范围的是（ ）。", "options": {"A": "固定付款额及实质固定付款额", "B": "取决于指数或比率的可变租赁付款额", "C": "向保险人先行支付的按租赁合同约定由出租人投保的运输保险费", "D": "根据承租人提供的担保余值预计支付的款项"}, "answer": "C", "analysis": "租赁付款额，是指承租人向出租人支付的与在租赁期内使用租赁资产的权利相关\n的款项，包括以下五项内容：\n（1）固定付款额及实质固定付款额，存在租赁激励的，扣除租赁激励相关金额。（选项 A）\n（2）取决于指数或比率的可变租赁付款额。（选项 B）\n（3）购买选择权的行权价格，前提是承租人合理确定将行使该选择权。\n（4）行使终止租赁选择权需支付的款项，前提是租赁期反映出承租人将行使终止租赁选\n择权。\n（5）根据承租人提供的担保余值预计应支付的款项。（选项 D）\n综上所述，选项 C 当选。", "favorite": false, "wrongCount": 0, "createdAt": 0, "id": "财务与会计|第十三章 非流动负债|86|单选|在租赁期开始日，下列不属于租赁付款额范围的是（）。"}, {"subject": "财务与会计", "chapter": "第十三章 非流动负债", "number": "87", "type": "单选", "stem": "在租赁期开始日，下列项目不属于租赁付款额范围的是（ ）。", "options": {"A": "固定付款额及实质固定付款额", "B": "取决于指数或比率的可变租赁付款额", "C": "根据出租人提供的担保余值预计应支付的款项", " 0", "C": "590", "D": "600"}, "answer": "B", "analysis": "客户支付非现金对价的，通常情况下，企业应当按照非现金对价在合同开始日（2021\n年 4 月 1 日）的公允价值（580 万元）确定交易价格，选项 B 当选。", "favorite": false, "wrongCount": 0, "createdAt": 0, "id": "财务与会计|第十五章 收入、费用、利润和外币交易|15.26|单选|2021年4月1日，甲公司与乙公司签订买卖合同"}, {"subject": "财务与会计", "chapter": "第十五章 收入、费用、利润和外币交易", "number": "15.27", "type": "多选", "stem": "下列关于确定交易价格的表述中，正确的有（ ）。", "options": {"A": "合同中存在可变对价的，企业应当按照期望值或最可能发生金额确定可变对价的最佳估 计数", "B": "包含可变对价的交易价格，应当不超过在相关不确定性消除时累计已确认收入极可能不 会发生重大转回的金额", "C": "期望值是指各种可能的对价金额中最有可能发生的金额", "D": "客户支付非现金对价的，企业应当按照非现金对价的公允价值确定交易价格", "E": "合同中存在重大融资成分的，企业应当按照假定客户在取得商品控制权时，即以现金支 付的应付金额（即现销价格）确定交易价格 15.28【例题】尚公司签订一项合同，向大型连锁零售店中公司销售商品，合同期限为 1 年。 中公司承诺，在合同期限内以约定价格购买至少价值 1 500 万元的产品。合同约定，尚公司需 在合同开始时向中公司支付 150 万元的不可退回款项，用于中公司更改货架以使其适合放置尚 公司产品。 尚公司支付中公司的款项并非为获取单独可区分商品，因为尚公司不享有改造货架的任何 控制权，因此，尚公司支付的款项应作为后续商品销售收入的抵减项。 根据合同约定，中公司承诺购货总价为 1 500 万元，因此，尚公司支付的 150 万元相当于 给予了每项商品 10%的折扣。尚公司在确认商品销售收入时，可按 10%的折扣计量收入金额。 15.29【例题】尚公司与客户签订合同，向其销售 R、S、T 三种产品，合同总价款为 270 万 元，这三种产品构成三项履约义务。尚公司经常以 100 万元单独出售 R 产品，其单独售价可直 接观察；S 产品和 T 产品的单独售价不可直接观察，尚公司采用市场调整法估计的 S 产品单独售 价为 50 万元，采用成本加成法估计的 T 产品单独售价为 150 万元。 尚公司通常以 100 万元的价格单独销售 R 产品，并将 S 产品和 T 产品组合在一起以 170 万 元的价格销售。上述价格均不包含增值税。 本例中，三种产品的单独售价合计为 300 万元，而该合同的价格为 270 万元，该合同的整 体折扣为 30 万元。由于尚公司经常将 S 产品和 T 产品组合在一起以 170 万元的价格销售，该价 格与其单独售价之和(200 万元)的差额为 30 万元，与该合同的整体折扣一致，而 R 产品单独销 售的价格与其单独售价一致，证明该合同的整体折扣仅应归属于 S 产品和 T 产品。 因此，在该合同下，分摊至 R 产品的交易价格为 100 万元，分摊至 S 产品和 T 产品的交易 价格合计为 170 万元，尚公司应当进一步按照 S 产品和 T 产品的单独售价的相对比例将该价格 在二者之间进行分摊：S 产品应分摊的交易价格为 42.5 万元(50÷200×170)，T 产品应分摊的 交易价格为 127.5 万元(150÷200×170)。 15.30【例题】尚公司承诺向某客户销售 120 件酸酒产品，每件酸酒产品售价 100 元。该批 酸酒产品彼此之间可明确区分，且将于未来 6 个月内陆续转让给该客户。尚公司将其中的 60 件 酸酒产品转让给该客户后，双方对合同进行了变更，尚公司承诺向该客户额外销售 30 件相同的 酸酒产品，这 30 件酸酒产品与原合同中的酸酒产品可明确区分，其售价为每件 95 元（假定该 价格反映了合同变更时该酸酒产品的单独售价）。上述价格均不包含增值税。 本例中，由于新增的 30 件酸酒产品是可明确区分的，且新增的合同价款反映了新增酸酒产 品的单独售价，因此，该合同变更实际上构成了一份单独的、在未来销售 30 件酸酒产品的新合 同，该新合同并不影响对原合同的会计处理。尚公司应当对原合同中的 120 件酸酒产品按每件 酸酒产品 100 元确认收入，对新合同中的 30 件酸酒产品按每件酸酒产品 95 元确认收入。 15.31【例题】尚公司承诺向某客户销售 120 件酸酒产品，每件酸酒产品售价 100 元。该批 酸酒产品彼此之间可明确区分，且将于未来 6 个月内陆续转让给该客户。尚公司将其中的 60 件 酸酒产品转让给该客户后，双方对合同进行了变更，尚公司承诺向该客户额外销售 30 件相同的 酸酒产品，新增销售的 30 件酸酒产品售价为每件 80 元（假定该价格不能反映合同变更时该酸 酒产品的单独售价）。上述价格均不包含增值税。 本例中，对于合同变更新增的 30 件产品，由于其售价不能反映该产品在合同变更时的单独 售价，因此，该合同变更不能作为单独合同进行会计处理。由于尚未转让给客户的产品（包括 原合同中尚未交付的 60 件产品以及新增的 30 件产品）与已转让的产品是可明确区分的。因此， 尚公司应当将该合同变更作为原合同终止，同时，将原合同未履约部分与合同变更合并为新合 同进行会计处理。 该新合同中，剩余产品为 90 件，其对价为 8 400 元，即原合同下尚未确认收入的客户已承 诺对价 6 000 元(100×60)与合同变更部分的对价 2 400 元(80×30)之和，新合同中的 90 件产 品每件产品应确认的收入为 93.33 元(8400÷90）。 15.32【例题】2025 年 1 月 15 日，“俺看中”建筑公司和客户签订了一项总金额为 1 000 万元的固定造价合同，在客户自有土地上建造一幢办公楼，预计合同总成本为 700 万元。假定 该建造服务属于在某一时段内履行的履约义务，并根据累计发生的合同成本占合同预计总成本 的比例确定履约进度。 截至 2025 年末，中公司累计已发生成本 420 万元，履约进度为 60% (420÷700)。因此，中 公司在 2025 年确认收入 600 万元(1 000×60%)。2026 年初，合同双方同意更改该办公楼屋顶的 设计，合同价格和预计总成本因此而分别增加 200 万元和 120 万元。 在本例中，由于合同变更后拟提供的剩余服务与在合同变更日或之前已提供的服务不可明 确区分(即该合同仍为单项履约义务)，因此，中公司应当将合同变更作为原合同的组成部分进 行会计处理。 合同变更后的交易价格=1 000+200=1 200（万元） 中公司重新估计的履约进度=420÷（700+120）=51.22% 中公司在合同变更日应额外确认收入 =1 200×51.22%-600=14.64（万元）"}, "answer": "ABDE", "analysis": "合同中存在可变对价的，企业应当按照期望值或最可能发生金额确定可变对价的\n最佳估计数，选项 A 当选；期望值是指各种可能的对价金额按概率加权平均数，最可能发生金\n额是指各种可能的对价金额中单一最有可能发生的金额，选项 C 不当选；包含可变对价的交易\n价格，应当不超过在相关不确定性消除时累计已确认收入极可能不会发生重大转回的金额，选\n项 B 当选；客户支付非现金对价的，企业应当按照非现金对价的公允价值确定交易价格，选项 D\n当选；合同中存在重大融资成分的，企业应当按照假定客户在取得商品控制权时，即以现金支\n付的应付金额（即现销价格）确定交易价格，选项 E 当选。", "favorite": false, "wrongCount": 0, "createdAt": 0, "id": "财务与会计|第十五章 收入、费用、利润和外币交易|15.27|多选|下列关于确定交易价格的表述中，正确的有（）。"}, {"subject": "财务与会计", "chapter": "第十五章 收入、费用、利润和外币交易", "number": "15.33", "type": "多选", "stem": "泰山健身房执行的会员政策为：月度会员 150 元，季度会员 400 元， 年度会员 1 500 元，会员补差即可升级。张三 2020 年 1 月 1 日缴纳 150 元加入月度会员；2 月 1 日补差 250 元，升级为季度会员；4 月 1 日又补差 1 100 元，升级为年度会员。假设不考虑税 费，收入金额的计量按月平均计算，则下列有关该健身房收入确认的表述中，正确的有（ ）。", "options": {"A": "1 600", "B": "1 200", "C": "1 800", "D": "1 400", "E": "合同各方已批准该合同并承诺将履行各自义务 （2）2019 年 6 月 30 日，黄河公司应确认该工程的履约进度为（ ）。"}, "answer": "ABC", "analysis": "2020 年 1 月确认收入：150 元；\n2020 年 2 月确认收入：400×2/3－150＝116.67（元） ；\n2020 年 3 月确认收入：400－150－116.6 function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("taxExamMvp", 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      d.createObjectStore(STORE.questions, { keyPath: "id" });
      d.createObjectStore(STORE.attempts, { keyPath: "questionId" });
      d.createObjectStore(STORE.meta, { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function tx(store, mode = "readonly") { return db.transaction(store, mode).objectStore(store); }
function getAll(store) {
  return new Promise((resolve) => {
    const req = tx(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}
function put(store, value) {
  return new Promise((resolve, reject) => {
    const req = tx(store, "readwrite").put(value);
    req.onsuccess = resolve;
    req.onerror = () => reject(req.error);
  });
}
function del(store, key) {
  return new Promise((resolve, reject) => {
    const req = tx(store, "readwrite").delete(key);
    req.onsuccess = resolve;
    req.onerror = () => reject(req.error);
  });
}
async function loadState() {
  questions = await getAll(STORE.questions);
  attempts = await getAll(STORE.attempts);
  const rows = await getAll(STORE.meta);
  meta = Object.fromEntries(rows.map(x => [x.key, x.value]));
  meta.round = meta.round || 1;
  $("roundNo").textContent = meta.round;
}
async function saveMeta(key, value) {
  meta[key] = value;
  await put(STORE.meta, { key, value });
}
function attemptFor(id) {
  return attempts.find(a => a.questionId === id) || { questionId: id, done: false, correct: false, wrong: false };
}
async function saveAttempt(next) {
  const existing = attemptFor(next.questionId);
  const row = { ...existing, ...next, updatedAt: Date.now() };
  const idx = attempts.findIndex(a => a.questionId === row.questionId);
  if (idx >= 0) attempts[idx] = row; else attempts.push(row);
  await put(STORE.attempts, row);
}
async function saveQuestion(q) {
  const idx = questions.findIndex(x => x.id === q.id);
  if (idx >= 0) questions[idx] = q; else questions.push(q);
  await put(STORE.questions, q);
}
function normalizeAnswer(s) {
  return String(s || "").toUpperCase().replace(/[^A-F]/g, "").split("").sort().join("");
}
function makeId(q) {

}
function chapterOrder(chapter) {
  const cn = {一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,十一:11,十二:12,十三:13,十四:14,十五:15,十六:16,十七:17,十八:18,十九:19,二十:20};
  const m = chapter.match(/第([一二三四五六七八九十\d]+)章/);
  if (!m) return 9999;
  return /^\d+$/.test(m[1]) ? Number(m[1]) : (cn[m[1]] || 9999);
}
function questionOrder(a, b) {
  const pa = String(a.number).split(".").map(Number);
  const pb = String(b.number).split(".").map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const diff = (pa[i] || 0) - (pb[i] || 0);
    if (diff) return diff;
  }
  return 0;
}

function pct(a, b) { return b ? Math.round(a * 100 / b) + "%" : "0%"; }
function groupedChapters(subject = currentSubject) {
  const map = new Map();
  questions.filter(q => q.subject === subject).forEach(q => {
    if (!map.has(q.chapter)) map.set(q.chapter, []);
    map.get(q.chapter).push(q);
  });
  return [...map.entries()].sort((a, b) => chapterOrder(a[0]) - chapterOrder(b[0]));
}
function summaryFor(list) {
  const done = list.filter(q => attemptFor(q.id).done).length;
  const correct = list.filter(q => attemptFor(q.id).correct).length;
  const wrong = list.filter(q => attemptFor(q.id).wrong).length;
  return { total: list.length, done, undone: list.length - done, correct, wrong, rate: pct(correct, done), finish: pct(done, list.length) };
}

  const chapters = [...new Set(source.filter(q => !subject || q.subject === subject).map(q => q.chapter))]
    .sort((a, b) => chapterOrder(a) - chapterOrder(b));
  chapterEl.innerHTML = `<option value="">全部章节</option>` + chapters.map(c => `<option>${c}</option>`).join("");
  if (chapters.includes(selectedChapter)) chapterEl.value = selectedChapter;
}
function questionRow(q, actions = true) {
  const a = attemptFor(q.id);
  return `<div class="row">
    <div>
      <div class="row-title">${q.number} · ${q.type} · ${q.chapter}</div>
      <div class="row-meta">${q.subject} · 错题次数 ${q.wrongCount || 0} · ${a.done ? (a.correct ? "已做正确" : "已做错误") : "未做"}</div>
      <div class="tiny">${escapeHtml(q.stem).slice(0, 120)}${q.stem.length > 120 ? "..." : ""}</div>
    </div>
    ${actions ? `<button data-open-question="${q.id}">查看</button>` : ""}
  </div>`;
}
function renderWrong() {
  const wrongIds = new Set(attempts.filter(a => a.wrong).map(a => a.questionId));
  let list = questions.filter(q => wrongIds.has(q.id));
  renderFilters($("wrongSubject"), $("wrongChapter"), list);
  if ($("wrongSubject").value) list = list.filter(q => q.subject === $("wrongSubject").value);
  if ($("wrongChapter").value) list = list.filter(q => q.chapter === $("wrongChapter").value);
  $("wrongList").innerHTML = list.length ? list.map(q => questionRow(q)).join("") : `<div class="empty">暂无错题。</div>`;
}
function renderFav() {
  let list = questions.filter(q => q.favorite);
  renderFilters($("favSubject"), $("favChapter"), list);
  if ($("favSubject").value) list = list.filter(q => q.subject === $("favSubject").value);
  if ($("favChapter").value) list = list.filter(q => q.chapter === $("favChapter").value);
  $("favList").innerHTML = list.length ? list.map(q => questionRow(q)).join("") : `<div class="empty">暂无收藏。</div>`;
}
function renderHeavy() {
  const list = questions.filter(q => (q.wrongCount || 0) >= 3).sort((a, b) => (b.wrongCount || 0) - (a.wrongCount || 0));
  $("heavyList").innerHTML = list.length ? list.map(q => questionRow(q)).join("") : `<div class="empty">错题次数达到 3 次后会自动进入这里。</div>`;
}
function renderSearch() {
  const kw = $("searchInput").value.trim().toLowerCase();
  if (!kw) { $("searchList").innerHTML = `<div class="empty">输入关键词后开始搜索。</div>`; return; }
  const list = questions.filter(q => [q.stem, q.analysis, q.chapter, q.number, q.subject, Object.values(q.options).join(" ")].join(" ").toLowerCase().includes(kw));
  $("searchList").innerHTML = list.length ? list.map(q => questionRow(q)).join("") : `<div class="empty">没有匹配结果。</div>`;
}
function showView(name) {
  ["home","import","practice","wrong","fav","heavy","search"].forEach(v => $("view-" + v).classList.toggle("hide", v !== name));
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  if (name === "home") renderHome();
  if (name === "wrong") renderWrong();
  if (name === "fav") renderFav();
  if (name === "heavy") renderHeavy();
  if (name === "search") renderSearch();
}
function startPractice(ids) {
  practice = { ids, index: 0, selected: new Set(), submitted: false };
  showView("practice");
  renderQuestion();
}
function openSingleQuestion(id) { startPractice([id]); }
function currentQuestion() { return questions.find(q => q.id === practice.ids[practice.index]); }
function renderQuestion(loadSaved = true) {
  const q = currentQuestion();
  if (!q) return;
  const a = attemptFor(q.id);
  if (loadSaved || practice.questionId !== q.id) {
    practice.selected = new Set(normalizeAnswer(a.lastAnswer || "").split("").filter(Boolean));
    practice.submitted = !!a.done;
    practice.questionId = q.id;
  }
  $("questionMeta").textContent = `${practice.index + 1}/${practice.ids.length} · ${q.number} · ${q.type}`;
  $("practiceBar").style.width = pct(practice.index + 1, practice.ids.length);
  $("questionStem").textContent = q.stem;
  $("optionList").innerHTML = Object.entries(q.options).map(([k, v]) => {
    const chosen = practice.selected.has(k);
    const answer = normalizeAnswer(q.answer).includes(k);
    const cls = [
      chosen ? "selected" : "",
      practice.submitted && answer ? "correct" : "",
      practice.submitted && chosen && !answer ? "wrong" : ""
    ].join(" ");
    return `<div class="option ${cls}" data-option="${k}"><div class="badge">${k}</div><div>${escapeHtml(v)}</div></div>`;
  }).join("");
  $("submitAnswerBtn").disabled = practice.submitted;
  $("favBtn").textContent = q.favorite ? "取消收藏" : "收藏";
  $("prevBtn").disabled = practice.index === 0;
  $("nextBtn").disabled = practice.index >= practice.ids.length - 1;
  renderAnswer(q, a);
  renderPracticeStats();
}
function renderAnswer(q, a) {
  const box = $("answerBox");
  if (!a.done) { box.classList.remove("show"); box.innerHTML = ""; return; }
  box.classList.add("show");
  box.innerHTML = `<div class="${a.correct ? "answer-ok" : "answer-bad"}">${a.correct ? "回答正确" : "回答错误"}</div>
    <div>你的答案：${normalizeAnswer(a.lastAnswer) || "未选择"}</div>
    <div>正确答案：${normalizeAnswer(q.answer)}</div>
    <div style="margin-top:8px"><b>解析</b><br>${escapeHtml(q.analysis || "暂无解析").replace(/\n/g, "<br>")}</div>`;
}
function renderPracticeStats() {
  const list = practice.ids.map(id => questions.find(q => q.id === id)).filter(Boolean);
  const s = summaryFor(list);
  $("practiceStats").innerHTML = `总题数 ${s.total}<br>已做 ${s.done}<br>未做 ${s.undone}<br>正确率 ${s.rate}`;
  $("quickJump").innerHTML = practice.ids.map((id, i) => {
    const a = attemptFor(id);
    const color = a.done ? (a.correct ? "var(--good)" : "var(--bad)") : "var(--muted)";
    return `<button data-jump="${i}" style="min-width:40px;color:${color}">${i + 1}</button>`;
  }).join("");
}
async function submitAnswer() {
  const q = currentQuestion();
  const chosen = [...practice.selected].sort().join("");
  if (!chosen) { toast("请先选择答案"); return; }
  const correct = chosen === normalizeAnswer(q.answer);
  const old = attemptFor(q.id);
  await saveAttempt({ questionId: q.id, done: true, correct, wrong: old.wrong || !correct, lastAnswer: chosen });
  if (!correct) {
    q.wrongCount = (q.wrongCount || 0) + 1;
    await saveQuestion(q);
  }
  renderQuestion();
  renderHome();
}
async function toggleFavorite() {
  const q = currentQuestion();
  q.favorite = !q.favorite;
  await saveQuestion(q);
  renderQuestion();
  toast(q.favorite ? "已收藏" : "已取消收藏");
}
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function cleanText(text) {
  return String(text || "")
    .replace(/\r/g, "\n")
    .replace(/[ \t]+/g, " ")
    .replace(/[．]/g, ".")
    .replace(/[。](?=[A-F][、.])/g, "\n")
    .replace(/\n{3,}/g, "\n\n");
}
function detectType(block) {
  if (/多项选择题|多选题|多选/.test(block)) return "多选";
  if (/单项选择题|单选题|单选/.test(block)) return "单选";
  const ans = block.match(/答案[:：]?\s*([A-F]{2,})/i);
  return ans ? "多选" : "单选";
}
function splitQuestionAnswerText(text) {
  const idx = text.search(/答案及解析|参考答案|答案解析|答案\s*[:：]/);
  if (idx > 100) return [text.slice(0, idx), text.slice(idx)];
  const parts = text.split(/\n\s*(?=第[一二三四五六七八九十\d]+章.*答案|答案与解析)/);
  return parts.length > 1 ? [parts[0], parts.slice(1).join("\n")] : [text, text];
}
function parseAnswerMap(answerText) {
  const map = new Map();
  const re = /(?:^|\n)\s*(\d+(?:\.\d+)?)\s*[、.．]?\s*(?:【?答案】?|答案)\s*[:：]?\s*([A-F]+)([\s\S]*?)(?=\n\s*\d+(?:\.\d+)?\s*[、.．]?\s*(?:【?答案】?|答案)\s*[:：]?\s*[A-F]+|\n\s*第[一二三四五六七八九十\d]+章|$)/gi;
  let m;
  while ((m = re.exec(answerText))) {
    const raw = m[3] || "";
    const analysis = raw.replace(/^\s*(?:【?解析】?|解析)\s*[:：]?/i, "").trim();
    map.set(m[1], { answer: normalizeAnswer(m[2]), analysis });
  }
  const compact = /(\d+(?:\.\d+)?)\s*[、.．]?\s*([A-F]{1,4})\s*(?:解析[:：]?([\s\S]*?))?(?=\n\s*\d+(?:\.\d+)?\s*[、.．]?\s*[A-F]{1,4}|$)/gi;
  while ((m = compact.exec(answerText))) {
    if (!map.has(m[1])) map.set(m[1], { answer: normalizeAnswer(m[2]), analysis: (m[3] || "").trim() });
  }
  return map;
}
function parseQuestions(text, subject) {
  text = cleanText(text);
  const [questionText, answerText] = splitQuestionAnswerText(text);
  const answerMap = parseAnswerMap(answerText);
  const lines = questionText.split("\n").map(l => l.trim()).filter(Boolean);
  let chapter = "未分章";
  const blocks = [];
  let current = null;
  for (const line of lines) {
    const c = line.match(/^(第[一二三四五六七八九十\d]+章)[\s　]*(.*)$/);
    if (c) { chapter = c[1] + (c[2] ? " " + c[2].trim() : ""); continue; }
    if (/简答题|计算题|综合分析题|综合题|问答题|案例分析题/.test(line)) {
      if (current) blocks.push(current);
      current = null;
      continue;
    }
    const qn = line.match(/^(\d+(?:\.\d+)?)\s*[、.．]\s*(.*)$/);
    if (qn && !/^答案|解析/.test(qn[2])) {
      if (current) blocks.push(current);
      current = { number: qn[1], chapter, lines: [qn[2]] };
      continue;
    }
    if (current) current.lines.push(line);
  }
  if (current) blocks.push(current);
  return blocks.map(b => blockToQuestion(b, subject, answerMap)).filter(Boolean);
}
function blockToQuestion(block, subject, answerMap) {
  const joined = block.lines.join("\n");
  const type = detectType(joined);
  if (!/(单选|多选|单项选择|多项选择)/.test(joined) && !/[A-F][、.．]/.test(joined)) return null;
  const optionRegex = /(?:^|\n)\s*([A-F])\s*[、.．]\s*([\s\S]*?)(?=\n\s*[A-F]\s*[、.．]|\n\s*答案[:：]|\n\s*解析[:：]|$)/g;
  const options = {};
  let m;
  while ((m = optionRegex.exec(joined))) options[m[1]] = m[2].trim();
  if (Object.keys(options).length < 2) return null;
  const firstOption = joined.search(/\n?\s*[A-F]\s*[、.．]/);
  const stem = (firstOption >= 0 ? joined.slice(0, firstOption) : joined)
    .replace(/^(单选题|多选题|单项选择题|多项选择题)\s*[：:]?/, "")
    .trim();
  const inlineAnswer = joined.match(/答案[:：]?\s*([A-F]+)/i);
  const inlineAnalysis = joined.match(/解析[:：]?([\s\S]*)$/i);
  const matched = answerMap.get(block.number) || {};
  const q = {
    subject,
    chapter: block.chapter,
    number: block.number,
    type,
    stem,
    options,
    answer: matched.answer || normalizeAnswer(inlineAnswer && inlineAnswer[1]),
    analysis: matched.analysis || (inlineAnalysis ? inlineAnalysis[1].trim() : ""),
    favorite: false,
    wrongCount: 0,
    createdAt: Date.now()
  };
  if (!q.answer) return null;
  q.id = makeId(q);
  return q;
}
async function loadPdfAsText(file) {
  if (file.name.toLowerCase().endsWith(".txt")) return file.text();
  if (!window.pdfjsLib) {
    await new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
      setTimeout(reject, 4500);
    }).catch(() => null);
  }
  if (!window.pdfjsLib) throw new Error("PDF.js 未加载，请粘贴 PDF 文本或导入 txt。");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const data = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    pages.push(content.items.map(x => x.str).join("\n"));
  }
  return pages.join("\n\n");
}
function renderPreview() {
  const byChapter = {};
  parsedPreview.forEach(q => byChapter[q.chapter] = (byChapter[q.chapter] || 0) + 1);
  $("parseSummary").innerHTML = `识别选择题 ${parsedPreview.length} 道<br>${Object.entries(byChapter).map(([c, n]) => `${c}: ${n}`).join("<br>") || ""}`;
  $("previewList").innerHTML = parsedPreview.slice(0, 20).map(q => questionRow(q, false)).join("") || `<div class="empty">未识别到单选或多选题。</div>`;
  $("importBtn").disabled = parsedPreview.length === 0;
}
async function parseImport() {
  const file = $("pdfFile").files[0];
  try {
    if (file && !$("importText").value.trim()) $("importText").value = await loadPdfAsText(file);
    parsedPreview = parseQuestions($("importText").value, $("importSubject").value);
    renderPreview();
  } catch (err) {
    toast(err.message || "解析失败");
  }
}
async function importQuestions() {
  const mode = $("duplicateMode").value;
  let added = 0, skipped = 0, overwritten = 0;
  for (const q of parsedPreview) {
    const old = questions.find(x => x.id === q.id);
    if (old && mode === "skip") { skipped++; continue; }
    if (old && mode === "overwrite") {
      q.favorite = old.favorite;
      q.wrongCount = old.wrongCount || 0;
      overwritten++;
    } else {
      added++;
    }
    await saveQuestion(q);
  }
  parsedPreview = [];
  $("importBtn").disabled = true;
  await loadState();
  await seedPreloadedBank();
  renderHome();
  renderPreview();
  toast(`导入完成：新增 ${added}，覆盖 ${overwritten}，跳过 ${skipped}`);
}
async function newRound() {
  if (!confirm("开始新一轮会清除已做状态和正确率统计，保留收藏、错题本、重点错题库。继续吗？")) return;
  for (const a of attempts) await saveAttempt({ ...a, done: false, correct: false, lastAnswer: "" });
  await saveMeta("round", (meta.round || 1) + 1);
  await loadState();
  await seedPreloadedBank();
  renderHome();
  toast("已开始新一轮学习");
}
function fillSample() {
  $("importSubject").value = "财务与会计";
  $("importText").value = `第一章 总论
1. 单选题 下列关于会计信息质量要求的表述中，正确的是（ ）。
A. 可靠性要求企业可以随意改变会计政策
B. 相关性要求会计信息有助于使用者决策
C. 谨慎性要求高估资产
D. 可比性要求不同企业采用完全不同口径

2. 多选题 下列属于会计基本假设的有（ ）。
A. 会计主体
B. 持续经营
C. 会计分期
D. 货币计量

答案及解析
1. 答案：B
解析：相关性要求会计信息应当有助于财务报告使用者作出经济决策。
2. 答案：ABCD
解析：会计基本假设包括会计主体、持续经营、会计分期和货币计量。`;
}

async function seedPreloadedBank() {
  const bank = window.PRELOADED_BANK;
  if (!bank || meta.seedVersion === bank.version) return;
  let added = 0, updated = 0;
  for (const q of bank.questions || []) {
    const old = questions.find(x => x.id === q.id);
    if (old) {
      await saveQuestion({ ...q, favorite: old.favorite, wrongCount: old.wrongCount || 0, createdAt: old.createdAt || Date.now() });
      updated++;
    } else {
      await saveQuestion({ ...q, createdAt: Date.now() });
      added++;
    }
  }
  await saveMeta("seedVersion", bank.version);
  await loadState();
  if (added || updated) toast(`题库已更新：新增 ${added}，更新 ${updated}`);
}

function wireEvents() {
  SUBJECTS.forEach(s => $("importSubject").innerHTML += `<option>${s}</option>`);
  $("themeBtn").innerHTML = icons.moon;
  $("themeBtn").onclick = () => {
    const dark = app.dataset.theme !== "dark";
    app.dataset.theme = dark ? "dark" : "light";
    $("themeBtn").innerHTML = dark ? icons.sun : icons.moon;
  };
  document.querySelector(".tabs").onclick = (e) => {
    const btn = e.target.closest("button[data-tab]");
    if (btn) showView(btn.dataset.tab);
  };
  $("subjectChips").onclick = (e) => {
    const btn = e.target.closest("button[data-subject]");
    if (!btn) return;
    currentSubject = btn.dataset.subject;
    renderHome();
  };
  $("chapterList").onclick = (e) => {
    const btn = e.target.closest("button[data-practice]");
    if (!btn) return;
    const [subject, chapter] = btn.dataset.practice.split("|||");
    startPractice(questions.filter(q => q.subject === subject && q.chapter === chapter).sort(questionOrder).map(q => q.id));
  };
  document.body.addEventListener("click", (e) => {
    const open = e.target.closest("button[data-open-question]");
    if (open) openSingleQuestion(open.dataset.openQuestion);
    const opt = e.target.closest(".option[data-option]");
    if (opt && !practice.submitted) {
      const q = currentQuestion();
      const key = opt.dataset.option;
      if (q.type === "单选") practice.selected = new Set([key]);
      else practice.selected.has(key) ? practice.selected.delete(key) : practice.selected.add(key);
      renderQuestion(false);
    }
    const jump = e.target.closest("button[data-jump]");
    if (jump) { practice.index = Number(jump.dataset.jump); renderQuestion(); }
  });
  $("parseBtn").onclick = parseImport;
  $("importBtn").onclick = importQuestions;
  $("sampleBtn").onclick = fillSample;
  $("clearTextBtn").onclick = () => { $("importText").value = ""; parsedPreview = []; renderPreview(); };
  $("submitAnswerBtn").onclick = submitAnswer;
  $("favBtn").onclick = toggleFavorite;
  $("prevBtn").onclick = () => { if (practice.index > 0) { practice.index--; renderQuestion(); } };
  $("nextBtn").onclick = () => { if (practice.index < practice.ids.length - 1) { practice.index++; renderQuestion(); } };
  $("backHomeBtn").onclick = () => showView("home");
  $("newRoundBtn").onclick = newRound;
  $("clearWrongBtn").onclick = async () => {
    if (!confirm("确认清空错题本？重点错题次数不会清零。")) return;
    for (const a of attempts.filter(x => x.wrong)) await saveAttempt({ ...a, wrong: false });
    await loadState(); renderWrong(); renderHome(); toast("错题本已清空");
  };
  $("searchInput").oninput = renderSearch;
  $("wrongSubject").onchange = renderWrong;
  $("wrongChapter").onchange = renderWrong;
  $("favSubject").onchange = renderFav;
  $("favChapter").onchange = renderFav;
}
(async function init() {
  wireEvents();
  db = await openDb();
  await loadState();
  await seedPreloadedBank();
  renderHome();
})();
</script>
