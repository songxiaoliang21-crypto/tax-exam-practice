<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>税务师刷题系统 MVP</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --panel-2: #eef3f8;
      --text: #152033;
      --muted: #697386;
      --line: #dbe2ea;
      --brand: #0f7f6b;
      --brand-2: #f4a12c;
      --bad: #d94b4b;
      --good: #16865d;
      --warn: #b7791f;
      --shadow: 0 12px 28px rgba(24, 39, 75, .08);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #111827;
      --panel: #182231;
      --panel-2: #243244;
      --text: #edf2f7;
      --muted: #a9b4c2;
      --line: #334155;
      --brand: #43b69f;
      --brand-2: #f3b45b;
      --bad: #ff7a7a;
      --good: #62d49f;
      --warn: #f5c16c;
      --shadow: 0 12px 28px rgba(0, 0, 0, .26);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }
    button, input, textarea, select { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      min-height: 40px;
      padding: 0 12px;
      cursor: pointer;
    }
    button.primary { background: var(--brand); border-color: var(--brand); color: white; }
    button.warn { border-color: rgba(217, 75, 75, .35); color: var(--bad); }
    button.ghost { background: transparent; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
      flex: 0 0 auto;
    }
    h1 { font-size: 17px; margin: 0; line-height: 1.2; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px;
    }
    .grid { display: grid; gap: 12px; }
    .stats {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .card, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .card { padding: 14px; }
    .metric b { display: block; font-size: 24px; margin-bottom: 4px; }
    .metric span { color: var(--muted); font-size: 13px; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding: 8px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    .tabs button {
      display: grid;
      place-items: center;
      gap: 2px;
      min-height: 48px;
      padding: 4px;
      font-size: 12px;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
    }
    .tabs button.active {
      background: var(--panel-2);
      color: var(--brand);
      border-color: var(--line);
    }
    .tabs svg, .icon { width: 19px; height: 19px; stroke-width: 2; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 18px 0 10px;
    }
    h2 { margin: 0; font-size: 18px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 40px;
    }
    textarea { min-height: 180px; resize: vertical; line-height: 1.6; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .import-grid {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      gap: 12px;
    }
    label span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }
    .list {
      display: grid;
      gap: 10px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .row-title { font-weight: 700; }
    .row-meta, .tiny { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 26px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .question-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 12px;
      align-items: start;
    }
    .question-title { font-size: 17px; line-height: 1.7; white-space: pre-wrap; }
    .question-title .em-red, .answer-box .em-red, .case-box .em-red { color: #d40000; font-weight: 700; }
    .question-title .em-bold, .answer-box .em-bold, .case-box .em-bold { font-weight: 700; }
    .case-box {
      margin: 12px 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      white-space: pre-wrap;
      line-height: 1.65;
    }
    .options {
      display: grid;
      gap: 9px;
      margin: 14px 0;
    }
    .option {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      background: var(--panel);
      line-height: 1.55;
    }
    .option.selected { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 9%, var(--panel)); }
    .option.correct { border-color: var(--good); }
    .option.wrong { border-color: var(--bad); }
    .badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--panel-2);
      font-weight: 800;
    }
    .answer-box {
      display: none;
      border-top: 1px solid var(--line);
      margin-top: 12px;
      padding-top: 12px;
      line-height: 1.65;
    }
    .answer-box.show { display: block; }
    .answer-ok { color: var(--good); font-weight: 800; }
    .answer-bad { color: var(--bad); font-weight: 800; }
    .side {
      display: grid;
      gap: 10px;
      position: sticky;
      top: 78px;
    }
    .progress {
      height: 8px;
      background: var(--panel-2);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar { height: 100%; background: var(--brand); width: 0%; }
    .hide { display: none !important; }
    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 30;
      max-width: min(92vw, 560px);
      display: none;
    }
    .toast.show { display: block; }
    .subject-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .subject-chips button.active {
      border-color: var(--brand);
      color: var(--brand);
      background: color-mix(in srgb, var(--brand) 10%, var(--panel));
    }
    @media (max-width: 860px) {
      main { padding: 12px 12px 86px; }
      .stats, .form-grid, .import-grid, .question-shell { grid-template-columns: 1fr; }
      .metric b { font-size: 21px; }
      .side { position: static; }
      .tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
      }
      .topbar { padding: 10px 12px; }
      .topbar .toolbar button:not(#themeBtn) { display: none; }
    }
  </style>
</head>
<body>
<div class="app" data-theme="light">
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo">税</div>
        <div>
          <h1>税务师刷题系统</h1>
          <div class="sub">本地题库 · 离线练习 · 第 <span id="roundNo">1</span> 轮</div>
        </div>
      </div>
      <div class="toolbar">
        <button id="themeBtn" title="切换明暗模式" aria-label="切换明暗模式"></button>
      </div>
    </div>
  </header>

  <main>
    <section id="view-home">
      <div class="grid stats" id="homeStats"></div>
      <div class="section-head">
        <h2>章节练习</h2>
        <div class="toolbar">
          <select id="studyMode" title="学习模式">
            <option value="withExamples">题目 + 例题</option>
            <option value="questionsOnly">仅题目</option>
          </select>
          <div class="subject-chips" id="subjectChips"></div>
        </div>
      </div>
      <div id="chapterList" class="list"></div>
    </section>

    <section id="view-import" class="hide">
      <div class="section-head">
        <h2>PDF / 文本导入</h2>
        <button class="ghost" id="sampleBtn">填入示例</button>
      </div>
      <div class="import-grid">
        <div class="panel card">
          <div class="form-grid">
            <label><span>科目</span><select id="importSubject"></select></label>
            <label><span>重复题处理</span><select id="duplicateMode"><option value="skip">自动跳过</option><option value="overwrite">覆盖更新</option></select></label>
            <label><span>章节识别</span><select id="chapterMode"><option value="auto">保留 PDF 章节</option><option value="fallback">缺失时归入未分章</option></select></label>
            <label><span>文件</span><input id="pdfFile" class="input" type="file" accept=".pdf,.txt"></label>
          </div>
          <div style="height:10px"></div>
          <textarea id="importText" placeholder="可粘贴 PDF 提取后的全文。结构建议：前半部分为题目，后半部分为答案和解析。"></textarea>
          <div class="toolbar" style="margin-top:10px">
            <button class="primary" id="parseBtn">解析预览</button>
            <button id="importBtn" disabled>导入题库</button>
            <button id="clearTextBtn">清空</button>
          </div>
          <p class="tiny">PDF 自动抽取依赖浏览器端 PDF.js。当前文件不联网也能刷题；若 PDF.js 未加载，可先把 PDF 文本复制到输入框。</p>
        </div>
        <div class="panel card">
          <h3>解析结果</h3>
          <div id="parseSummary" class="tiny">尚未解析</div>
          <div id="previewList" class="list" style="margin-top:10px"></div>
        </div>
      </div>
    </section>

    <section id="view-practice" class="hide">
      <div class="question-shell">
        <div class="panel card">
          <div class="toolbar" style="justify-content:space-between">
            <button id="backHomeBtn">返回章节</button>
            <span class="pill" id="questionMeta"></span>
          </div>
          <div class="progress" style="margin:12px 0"><div class="bar" id="practiceBar"></div></div>
          <div id="caseBox" class="case-box hide"></div>
          <div class="question-title" id="questionStem"></div>
          <div class="options" id="optionList"></div>
          <div class="toolbar">
            <button class="primary" id="submitAnswerBtn">提交答案</button>
            <button id="favBtn">收藏</button>
            <button id="prevBtn">上一题</button>
            <button id="nextBtn">下一题</button>
          </div>
          <div id="answerBox" class="answer-box"></div>
        </div>
        <aside class="side">
          <div class="card">
            <h3>本组进度</h3>
            <div id="practiceStats" class="tiny"></div>
          </div>
          <div class="card">
            <h3>快速跳题</h3>
            <div class="toolbar" id="quickJump"></div>
          </div>
        </aside>
      </div>
    </section>

    <section id="view-wrong" class="hide">
      <div class="section-head"><h2>错题本</h2><div class="toolbar"><button id="clearWrongBtn" class="warn">清空错题</button></div></div>
      <div class="toolbar"><select id="wrongSubject"></select><select id="wrongChapter"></select></div>
      <div id="wrongList" class="list" style="margin-top:12px"></div>
    </section>

    <section id="view-fav" class="hide">
      <div class="section-head"><h2>收藏夹</h2></div>
      <div class="toolbar"><select id="favSubject"></select><select id="favChapter"></select></div>
      <div id="favList" class="list" style="margin-top:12px"></div>
    </section>

    <section id="view-heavy" class="hide">
      <div class="section-head"><h2>重点错题库</h2></div>
      <div id="heavyList" class="list"></div>
    </section>

    <section id="view-search" class="hide">
      <div class="section-head"><h2>搜索</h2></div>
      <input id="searchInput" class="input" placeholder="题干、知识点、章节、题号">
      <div id="searchList" class="list" style="margin-top:12px"></div>
    </section>

    <section id="view-audit" class="hide">
      <div class="section-head"><h2>题库审计</h2></div>
      <div id="auditSummary" class="grid stats"></div>
      <div id="auditList" class="list" style="margin-top:12px"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="主导航">
    <button data-tab="home" class="active" title="首页"></button>
    <button data-tab="import" title="导入"></button>
    <button data-tab="wrong" title="错题"></button>
    <button data-tab="fav" title="收藏"></button>
    <button data-tab="heavy" title="重点错题"></button>
    <button data-tab="search" title="搜索"></button>
    <button data-tab="audit" title="审计"></button>
  </nav>
  <div id="toast" class="toast"></div>
</div>

<script>
window.PRELOADED_BANK = null;
window.PRELOADED_AUDIT = null;
const SUBJECTS = ["财务与会计", "涉税服务实务", "涉税服务法律"];
const STORE = { questions: "questions", attempts: "attempts", meta: "meta" };
const app = document.querySelector(".app");
const $ = (id) => document.getElementById(id);
const icons = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3a6.8 6.8 0 0 0 8.8 8.8A9 9 0 1 1 12 3Z"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 10 9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg><span>首页</span>',
  import: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>导入</span>',
  wrong: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 3h4l1 2h4v18H5V5h4Z"/><path d="m9 12 6 6M15 12l-6 6"/></svg><span>错题</span>',
  fav: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6-4.4-4.3 6.1-.9Z"/></svg><span>收藏</span>',
  heavy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2 3 21h18Z"/><path d="M12 8v5M12 17h.01"/></svg><span>重点</span>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>搜索</span>',
  audit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l2 2 4-4"/><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg><span>审计</span>'
};
document.querySelector('[data-tab="home"]').innerHTML = icons.home;
document.querySelector('[data-tab="import"]').innerHTML = icons.import;
document.querySelector('[data-tab="wrong"]').innerHTML = icons.wrong;
document.querySelector('[data-tab="fav"]').innerHTML = icons.fav;
document.querySelector('[data-tab="heavy"]').innerHTML = icons.heavy;
document.querySelector('[data-tab="search"]').innerHTML = icons.search;
document.querySelector('[data-tab="audit"]').innerHTML = icons.audit;

let db, questions = [], attempts = [], meta = {}, currentSubject = SUBJECTS[0];
let parsedPreview = [], practice = { ids: [], index: 0, selected: new Set(), submitted: false };
const BACKUP_KEY = "taxExamMvp.backup.v2";

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("taxExamMvp", 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      d.createObjectStore(STORE.questions, { keyPath: "id" });
      d.createObjectStore(STORE.attempts, { keyPath: "questionId" });
      d.createObjectStore(STORE.meta, { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function tx(store, mode = "readonly") { return db.transaction(store, mode).objectStore(store); }
function getAll(store) {
  return new Promise((resolve) => {
    const req = tx(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}
function put(store, value) {
  return new Promise((resolve, reject) => {
    const req = tx(store, "readwrite").put(value);
    req.onsuccess = resolve;
    req.onerror = () => reject(req.error);
  });
}
function del(store, key) {
  return new Promise((resolve, reject) => {
    const req = tx(store, "readwrite").delete(key);
    req.onsuccess = resolve;
    req.onerror = () => reject(req.error);
  });
}
async function loadState() {
  questions = await getAll(STORE.questions);
  attempts = await getAll(STORE.attempts);
  const rows = await getAll(STORE.meta);
  meta = Object.fromEntries(rows.map(x => [x.key, x.value]));
  meta.round = meta.round || 1;
  if (!attempts.length) await restoreBackup();
  $("roundNo").textContent = meta.round;
}
function backupState() {
  try {
    const questionState = questions.filter(q => q.favorite || q.wrongCount).map(q => ({ id: q.id, favorite: !!q.favorite, wrongCount: q.wrongCount || 0 }));
    localStorage.setItem(BACKUP_KEY, JSON.stringify({ attempts, meta, questionState, savedAt: Date.now() }));
  } catch (err) {
    console.warn("backup failed", err);
  }
}
async function restoreBackup() {
  try {
    const raw = localStorage.getItem(BACKUP_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data.attempts) && data.attempts.length && !attempts.length) {
      for (const a of data.attempts) await put(STORE.attempts, a);
      attempts = data.attempts;
    }
    if (data.meta && !Object.keys(meta).length) {
      for (const [key, value] of Object.entries(data.meta)) await put(STORE.meta, { key, value });
      meta = data.meta;
    }
    if (Array.isArray(data.questionState)) {
      const state = new Map(data.questionState.map(x => [x.id, x]));
      for (const q of questions) {
        const s = state.get(q.id);
        if (s) await saveQuestion({ ...q, favorite: !!s.favorite, wrongCount: s.wrongCount || 0 });
      }
    }
  } catch (err) {
    console.warn("restore failed", err);
  }
}
async function saveMeta(key, value) {
  meta[key] = value;
  await put(STORE.meta, { key, value });
  backupState();
}
function attemptFor(id) {
  return attempts.find(a => a.questionId === id) || { questionId: id, done: false, correct: false, wrong: false };
}
async function saveAttempt(next) {
  const existing = attemptFor(next.questionId);
  const row = { ...existing, ...next, updatedAt: Date.now() };
  const idx = attempts.findIndex(a => a.questionId === row.questionId);
  if (idx >= 0) attempts[idx] = row; else attempts.push(row);
  await put(STORE.attempts, row);
  backupState();
}
async function saveQuestion(q) {
  const idx = questions.findIndex(x => x.id === q.id);
  if (idx >= 0) questions[idx] = q; else questions.push(q);
  await put(STORE.questions, q);
  backupState();
}
function normalizeAnswer(s) {
  return String(s || "").toUpperCase().replace(/[^A-F]/g, "").split("").sort().join("");
}
function makeId(q) {
  return [q.subject, q.chapter, q.number, q.type].join("|").replace(/\s+/g, "");
}
function chapterOrder(chapter) {

    const page = await pdf.getPage(i);

function auditParsedQuestions(list) {

      if (/答案|解析|正确答案/.test(q.stem || "")) issues.push({ level: "error", number: q.number, reason: "题干混入答案或解析" });

    if (file && !$("importText").value.trim()) $("importText").value = await loadPdfAsText(file);
    parsedPreview = parseQuestions($("importText").value, $("importSubject").value);
    renderPreview();
  } catch (err) {
    toast(err.message || "解析失败");
  }
}
async function importQuestions() {
  const audit = auditParsedQuestions(parsedPreview);
  if (audit.errors) { toast("题库自检未通过，已阻止导入"); return; }
  const mode = $("duplicateMode").value;
  let added = 0, skipped = 0, overwritten = 0;
  for (const q of parsedPreview) {
    const old = questions.find(x => x.id === q.id);
    if (old && mode === "skip") { skipped++; continue; }
    if (old && mode === "overwrite") {
      q.favorite = old.favorite;
      q.wrongCount = old.wrongCount || 0;
      overwritten++;
    } else {
      added++;
    }
    await saveQuestion(q);
  }
  parsedPreview = [];
  $("importBtn").disabled = true;
  await loadState();
  await seedPreloadedBank();
  renderHome();
  renderPreview();
  toast(`导入完成：新增 ${added}，覆盖 ${overwritten}，跳过 ${skipped}`);
}
async function newRound() {
  if (!confirm("开始新一轮会清除已做状态和正确率统计，保留收藏、错题本、重点错题库。继续吗？")) return;
  for (const a of attempts) await saveAttempt({ ...a, done: false, correct: false, lastAnswer: "" });
  await saveMeta("round", (meta.round || 1) + 1);
  await loadState();
  await seedPreloadedBank();
  renderHome();
  toast("已开始新一轮学习");
}
async function resetChapter(subject, chapter) {
  if (!confirm(`确认重新刷 ${chapter}？仅清除本章作答记录、正确率和完成率，收藏和错题次数保留。`)) return;
  const ids = new Set(questions.filter(q => q.subject === subject && q.chapter === chapter && isAnswerable(q)).map(q => q.id));
  for (const a of attempts.filter(x => ids.has(x.questionId))) await del(STORE.attempts, a.questionId);
  attempts = attempts.filter(x => !ids.has(x.questionId));
  backupState();
  renderHome();
  toast("本章作答记录已清除");
}
function fillSample() {
  $("importSubject").value = "财务与会计";
  $("importText").value = `第一章 总论
1. 单选题 下列关于会计信息质量要求的表述中，正确的是（ ）。
A. 可靠性要求企业可以随意改变会计政策
B. 相关性要求会计信息有助于使用者决策
C. 谨慎性要求高估资产
D. 可比性要求不同企业采用完全不同口径

2. 多选题 下列属于会计基本假设的有（ ）。
A. 会计主体
B. 持续经营
C. 会计分期
D. 货币计量

答案及解析
1. 答案：B
解析：相关性要求会计信息应当有助于财务报告使用者作出经济决策。
2. 答案：ABCD
解析：会计基本假设包括会计主体、持续经营、会计分期和货币计量。`;
}

async function seedPreloadedBank() {
  const bank = window.PRELOADED_BANK;
  if (!bank || meta.seedVersion === bank.version) return;
  let added = 0, updated = 0, migrated = 0, removed = 0;
  const bankIds = new Set((bank.questions || []).map(q => q.id));
  const byStable = new Map(questions.map(q => [[q.subject, q.chapter, q.number, q.type].join("|"), q]));
  const replaceScopes = Array.isArray(bank.replaceScopes)
    ? bank.replaceScopes
    : (bank.subject && bank.subject !== "全科题库" ? [{ subject: bank.subject }] : []);
  const inReplaceScope = (q) => replaceScopes.some(scope => {
    if (scope.subject && q.subject !== scope.subject) return false;
    const order = chapterOrder(q.chapter);
    if (Number.isFinite(scope.chapterMin) && order < scope.chapterMin) return false;
    if (Number.isFinite(scope.chapterMax) && order > scope.chapterMax) return false;
    return true;
  });
  for (const q of bank.questions || []) {
    const stableKey = [q.subject, q.chapter, q.number, q.type].join("|");
    const old = questions.find(x => x.id === q.id) || byStable.get(stableKey);
    if (old) {
      if (old.id !== q.id) {
        const oldAttempt = attempts.find(a => a.questionId === old.id);
        if (oldAttempt && !attempts.find(a => a.questionId === q.id)) {
          await saveAttempt({ ...oldAttempt, questionId: q.id });
          migrated++;
        }
      }
      await saveQuestion({ ...q, favorite: old.favorite, wrongCount: old.wrongCount || 0, createdAt: old.createdAt || Date.now() });
      updated++;
    } else {
      await saveQuestion({ ...q, createdAt: Date.now() });
      added++;
    }
  }
  for (const old of [...questions]) {
    if ((old.subject === bank.subject || inReplaceScope(old)) && !bankIds.has(old.id)) {
      await del(STORE.questions, old.id);
      const oldAttempt = attempts.find(a => a.questionId === old.id);
      if (oldAttempt) await del(STORE.attempts, old.id);
      removed++;
    }
  }
  await saveMeta("seedVersion", bank.version);
  await saveMeta("lastAudit", window.PRELOADED_AUDIT || null);
  await loadState();
  backupState();
  if (added || updated || migrated || removed) toast(`题库已更新：新增 ${added}，更新 ${updated}，清理旧题 ${removed}`);
}

async function loadBundledBank() {
  if (window.PRELOADED_BANK) return;
  try {
    const [bankRes, auditRes] = await Promise.all([
      fetch("./finance-question-bank.json", { cache: "no-cache" }),
      fetch("./finance-question-bank-audit.json", { cache: "no-cache" }).catch(() => null)
    ]);
    if (!bankRes.ok) throw new Error(`题库文件加载失败：${bankRes.status}`);
    window.PRELOADED_BANK = await bankRes.json();
    if (auditRes && auditRes.ok) window.PRELOADED_AUDIT = await auditRes.json();
  } catch (err) {
    console.error(err);
    toast("题库加载失败，请刷新重试");
  }
}

function wireEvents() {
  SUBJECTS.forEach(s => $("importSubject").innerHTML += `<option>${s}</option>`);
  $("themeBtn").innerHTML = icons.moon;
  $("themeBtn").onclick = () => {
    const dark = app.dataset.theme !== "dark";
    app.dataset.theme = dark ? "dark" : "light";
    $("themeBtn").innerHTML = dark ? icons.sun : icons.moon;
  };
  document.querySelector(".tabs").onclick = (e) => {
    const btn = e.target.closest("button[data-tab]");
    if (btn) showView(btn.dataset.tab);
  };
  $("subjectChips").onclick = (e) => {
    const btn = e.target.closest("button[data-subject]");
    if (!btn) return;
    currentSubject = btn.dataset.subject;
    renderHome();
  };
  $("chapterList").onclick = (e) => {
    const btn = e.target.closest("button[data-practice]");
    const resetBtn = e.target.closest("button[data-reset-chapter]");
    if (resetBtn) {
      const [subject, chapter] = resetBtn.dataset.resetChapter.split("|||");
      resetChapter(subject, chapter);
      return;
    }
    if (btn) {
      const [subject, chapter] = btn.dataset.practice.split("|||");
      const includeExamples = (meta.studyMode || "withExamples") === "withExamples";
      startPractice(questions.filter(q => q.subject === subject && q.chapter === chapter && (includeExamples || !isExample(q))).sort(questionOrder).map(q => q.id));
    }
  };
  document.body.addEventListener("click", (e) => {
    const open = e.target.closest("button[data-open-question]");
    if (open) openSingleQuestion(open.dataset.openQuestion);
    const opt = e.target.closest(".option[data-option]");
    if (opt) {
      const q = currentQuestion();
      if (!isAnswerable(q)) return;
      const key = opt.dataset.option;
      if (q.type === "单选") practice.selected = new Set([key]);
      else practice.selected.has(key) ? practice.selected.delete(key) : practice.selected.add(key);
      renderQuestion(false);
    }
    const jump = e.target.closest("button[data-jump]");
    if (jump) { practice.index = Number(jump.dataset.jump); renderQuestion(); }
  });
  $("parseBtn").onclick = parseImport;
  $("importBtn").onclick = importQuestions;
  $("sampleBtn").onclick = fillSample;
  $("clearTextBtn").onclick = () => { $("importText").value = ""; parsedPreview = []; renderPreview(); };
  $("submitAnswerBtn").onclick = submitAnswer;
  $("favBtn").onclick = toggleFavorite;
  $("prevBtn").onclick = () => { if (practice.index > 0) { practice.index--; renderQuestion(); } };
  $("nextBtn").onclick = () => { if (practice.index < practice.ids.length - 1) { practice.index++; renderQuestion(); } };
  $("backHomeBtn").onclick = () => showView("home");
  $("studyMode").onchange = async () => { await saveMeta("studyMode", $("studyMode").value); renderHome(); };
  $("clearWrongBtn").onclick = async () => {
    if (!confirm("确认清空错题本？重点错题次数不会清零。")) return;
    for (const a of attempts.filter(x => x.wrong)) await saveAttempt({ ...a, wrong: false });
    await loadState(); renderWrong(); renderHome(); toast("错题本已清空");
  };
  $("searchInput").oninput = renderSearch;
  $("wrongSubject").onchange = renderWrong;
  $("wrongChapter").onchange = renderWrong;
  $("favSubject").onchange = renderFav;
  $("favChapter").onchange = renderFav;
}
(async function init() {
  wireEvents();
  db = await openDb();
  await loadState();
  await loadBundledBank();
  await seedPreloadedBank();
  renderHome();
})();
</script>
